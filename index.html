<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financial Entry</title>

    <!-- Flatpickr -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 
           Body Padding dashboard.html-এর সাথে ১০০% সমান রাখা হয়েছে 
           যাতে ২ পেজে সুইচের সময় Top Position চেঞ্জ না হয়।
        */
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #ecfeff 100%);
            min-height: 100vh;
            color: #1e293b;
            padding: 24px 16px; /* Top/Bottom padding exact matched */
        }

        /* =========================
           MAIN CONTAINER
        ========================= */
        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto; /* Zero top/bottom margin to avoid layout shifting */
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10), 0 4px 12px rgba(15, 23, 42, 0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* =========================
           HEADER (Zero Jitter Alignment)
        ========================= */
        .header {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            padding: 24px 28px;
            color: white;
            min-height: 96px; /* Explicit height to lock header size */
            display: flex;
            align-items: center;
        }

        .header-top {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .title-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .title-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            backdrop-filter: blur(4px);
            flex-shrink: 0;
        }

        .title-section h1 {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.3px;
        }

        .title-section p {
            font-size: 13px;
            margin-top: 3px;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.3;
        }

        .btn-dashboard {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.18);
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-dashboard:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: translateY(-1px);
        }

        /* =========================
           FORM AREA
        ========================= */
        .form-area {
            padding: 28px 30px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 22px;
            text-transform: uppercase;
            letter-spacing: 0.7px;
        }

        .section-title::before {
            content: "";
            width: 4px;
            height: 16px;
            background: #6366f1;
            border-radius: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }

        .required {
            color: #ef4444;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #64748b;
            pointer-events: none;
            z-index: 2;
        }

        input, select {
            width: 100%;
            height: 46px;
            padding: 0 14px 0 40px;
            border: 1px solid #d7dee8;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            color: #1e293b;
            background: #f8fafc;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        select {
            cursor: pointer;
            appearance: auto;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:hover, select:hover {
            border-color: #a5b4fc;
            background: #ffffff;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(99,102,241,0.12);
        }

        input:disabled, select:disabled {
            background: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .amount-wrapper input {
            padding-left: 42px;
            padding-right: 60px;
            font-weight: 600;
        }

        .currency {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            background: #e2e8f0;
            padding: 4px 7px;
            border-radius: 5px;
            pointer-events: none;
        }

        .sub-category-note {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 6px;
        }

        .divider {
            height: 1px;
            background: #e2e8f0;
            margin: 26px 0 22px;
        }

        button[type="submit"] {
            width: 100%;
            height: 49px;
            margin-top: 5px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 7px 18px rgba(16,185,129,0.22);
            transition: all 0.2s ease;
        }

        button[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(16,185,129,0.28);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:disabled {
            background: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #statusMsg {
            display: none;
            text-align: center;
            margin-top: 16px;
            padding: 11px 14px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 600;
        }

        #statusMsg.success {
            display: block;
            color: #047857;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
        }

        #statusMsg.error {
            display: block;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        #statusMsg.loading {
            display: block;
            color: #0369a1;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
        }

        .footer-note {
            text-align: center;
            padding: 0 30px 22px;
            font-size: 10px;
            color: #94a3b8;
        }

        .flatpickr-calendar {
            border-radius: 12px !important;
            box-shadow: 0 15px 35px rgba(15,23,42,0.18) !important;
            border: 1px solid #e2e8f0 !important;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                border-radius: 16px;
            }

            .header {
                padding: 18px 20px;
                min-height: auto;
            }

            .header-top {
                gap: 12px;
            }

            .title-icon {
                width: 42px;
                height: 42px;
                font-size: 20px;
            }

            .title-section h1 {
                font-size: 18px;
            }

            .title-section p {
                font-size: 11px;
            }

            .btn-dashboard {
                padding: 8px 12px;
                font-size: 12px;
            }

            .form-area {
                padding: 20px 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .form-group.full-width {
                grid-column: span 1;
            }
        }

        @media (max-width: 440px) {
            .header-top {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-dashboard {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">
        <div class="header-top">
            <div class="title-section">
                <div class="title-icon">💰</div>
                <div>
                    <h1>Financial Entry</h1>
                    <p>Record your income, expenses & investments</p>
                </div>
            </div>
            <a href="dashboard.html" class="btn-dashboard">
                📊 <span>Dashboard</span>
            </a>
        </div>
    </div>

    <!-- FORM AREA -->
    <div class="form-area">
        <div class="section-title">Transaction Details</div>

        <form id="financeForm">
            <div class="form-grid">

                <!-- DATE -->
                <div class="form-group">
                    <label for="date">
                        📅 Date <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">📅</span>
                        <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" required>
                    </div>
                </div>

                <!-- TRANSACTION TYPE -->
                <div class="form-group">
                    <label for="transactionType">
                        🔄 Transaction Type <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">↔️</span>
                        <select id="transactionType" name="transactionType" onchange="updateSubCategories()" required>
                            <option value="">Select Type</option>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                            <option value="Investment">Investment</option>
                            <option value="Loan/Transfer">Loan / Transfer</option>
                            <option value="Asset">Asset</option>
                            <option value="Liability">Liability</option>
                        </select>
                    </div>
                </div>

                <!-- SUB CATEGORY -->
                <div class="form-group full-width">
                    <label for="subCategory">
                        🗂️ Sub Category <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">📁</span>
                        <select id="subCategory" name="subCategory" required disabled>
                            <option value="">Select Transaction Type First</option>
                        </select>
                    </div>
                    <div class="sub-category-note">
                        Select a transaction type to view available categories.
                    </div>
                </div>

                <!-- PAYMENT METHOD -->
                <div class="form-group">
                    <label for="paymentMethod">
                        💳 Payment Method <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">💳</span>
                        <select id="paymentMethod" name="paymentMethod" required>
                            <option value="">Select Method</option>
                            <option value="Cash">Cash</option>
                            <option value="DBBL">DBBL</option>
                            <option value="JBL">JBL</option>
                            <option value="BDBL">BDBL</option>
                            <option value="IBBL">IBBL</option>
                            <option value="SCB_V">SCB_V</option>
                            <option value="SCB_M">SCB_M</option>
                            <option value="EBL_V">EBL_V</option>
                            <option value="EBL_M">EBL_M</option>
                            <option value="Meghna">Meghna</option>
                            <option value="bKash">bKash</option>
                            <option value="Nagad">Nagad</option>
                            <option value="Rocket">Rocket</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                            <option value="Credit Card">Credit Card</option>
                        </select>
                    </div>
                </div>

                <!-- AMOUNT -->
                <div class="form-group">
                    <label for="amount">
                        💵 Amount <span class="required">*</span>
                    </label>
                    <div class="input-wrapper amount-wrapper">
                        <span class="input-icon">৳</span>
                        <input type="number" id="amount" name="amount" min="0" step="any" placeholder="0.00" required>
                        <span class="currency">BDT</span>
                    </div>
                </div>

            </div>

            <div class="divider"></div>

            <!-- SUBMIT BUTTON -->
            <button type="submit" id="submitBtn">💾 Save Transaction</button>
        </form>

        <!-- STATUS MESSAGE -->
        <p id="statusMsg"></p>
    </div>

    <div class="footer-note">
        All transaction records are securely saved to Google Sheets.
    </div>

</div>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    let formattedBackendDate = "";

    function setBackendDate(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        formattedBackendDate = `${year}-${month}-${day}`;
    }

    const fp = flatpickr("#date", {
        dateFormat: "d/m/Y",
        defaultDate: "today",
        allowInput: true,
        onReady: function(selectedDates) {
            if (selectedDates[0]) setBackendDate(selectedDates[0]);
        },
        onChange: function(selectedDates) {
            if (selectedDates[0]) setBackendDate(selectedDates[0]);
        }
    });

    const subCategoriesData = {
        "Income": [
            "Salary", "Honourarium", "Bank Int", "FDR_Int", "Bond_Int", 
            "SP_Int", "Rent", "Business", "Freelancing", "Other Income"
        ],
        "Expense": [
            "Bazar", "Food", "Dress", "Family", "Education", "Medicine", 
            "Treatment", "Donation", "Zakat", "Gift", "Social Exp", 
            "Travelling", "Car_Driver", "Car_oil", "Car_Maint", "Fare", 
            "Paper", "Rent", "Utility Bill", "Mobile/Internet", "Other Expense"
        ],
        "Investment": [
            "SP", "FDR", "Bond", "Land", "Building", "Chuti", 
            "DPS", "Share Market", "Mutual Fund"
        ],
        "Loan/Transfer": [
            "Loan Given", "Loan Taken", "Loan Repaid", "Loan Received", "Bank Transfer"
        ],
        "Asset": [
            "Building", "SP", "FDR", "Land", "Gold", "Vehicle", 
            "Electronics", "Cash/Bank Balance"
        ],
        "Liability": [
            "Home Loan", "Personal Loan", "Credit Card Due", "Other Payable"
        ]
    };

    function updateSubCategories() {
        const typeSelect = document.getElementById("transactionType");
        const subSelect = document.getElementById("subCategory");
        const selectedType = typeSelect.value;

        subSelect.innerHTML = '<option value="">Select Sub Category</option>';

        if (selectedType && subCategoriesData[selectedType]) {
            subSelect.disabled = false;
            subCategoriesData[selectedType].forEach(subCat => {
                const option = document.createElement("option");
                option.value = subCat;
                option.textContent = subCat;
                subSelect.appendChild(option);
            });
        } else {
            subSelect.disabled = true;
            subSelect.innerHTML = '<option value="">Select Transaction Type First</option>';
        }
    }

    const scriptURL = 'https://script.google.com/macros/s/AKfycbyjf9eQuTWzXa7wazCLlZR1iHLm7Cj2E4X2WjkC9SvwgwxcgTqc0pnlzZBDTN_S47tJ/exec';

    const form = document.getElementById('financeForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', e => {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerHTML = '⏳ Saving Transaction...';

        statusMsg.className = "loading";
        statusMsg.innerText = "Saving transaction to Google Sheets...";

        const formData = new FormData(form);
        formData.set('date', formattedBackendDate);

        fetch(scriptURL, { method: 'POST', body: formData })
        .then(response => {
            statusMsg.className = "success";
            statusMsg.innerText = "✓ Transaction saved successfully!";

            form.reset();

            fp.setDate(new Date());
            setBackendDate(new Date());

            const subCategory = document.getElementById("subCategory");
            subCategory.disabled = true;
            subCategory.innerHTML = '<option value="">Select Transaction Type First</option>';

            submitBtn.disabled = false;
            submitBtn.innerHTML = '💾 Save Transaction';

            setTimeout(() => {
                statusMsg.className = "";
                statusMsg.style.display = "none";
            }, 4000);
        })
        .catch(error => {
            console.error(error);
            statusMsg.className = "error";
            statusMsg.innerText = "✕ Error saving data. Please try again.";

            submitBtn.disabled = false;
            submitBtn.innerHTML = '💾 Save Transaction';
        });
    });
</script>

</body>
</html>
