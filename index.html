<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Entry</title>
    
    <!-- Google Fonts & Flatpickr CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc, #ecfeff);
            min-height: 100vh;
            color: #1e293b;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            padding: 25px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 700;
        }

        .header-title p {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 4px;
        }

        .btn-dashboard {
            padding: 9px 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-dashboard:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            color: #1e293b;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #6366f1;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        select:disabled {
            background-color: #f1f5f9;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #statusMsg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            display: none;
            font-weight: 500;
        }

        #statusMsg.loading {
            display: block;
            background-color: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        #statusMsg.success {
            display: block;
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        #statusMsg.error {
            display: block;
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <h1>➕ New Transaction</h1>
            <p>Add income, expense, or investment entry</p>
        </div>
        <a href="dashboard.html" class="btn-dashboard">📊 Dashboard</a>
    </div>

    <form id="entryForm">
        <div class="form-group">
            <label for="date">Date</label>
            <input type="text" id="date" placeholder="Select Date" required>
        </div>

        <div class="form-group">
            <label for="transactionType">Transaction Type</label>
            <select id="transactionType" required onchange="updateSubCategories()">
                <option value="">Select Type</option>
                <option value="Income">Income</option>
                <option value="Expense">Expense</option>
                <option value="Investment">Investment</option>
                <option value="Loan/Transfer">Loan / Transfer</option>
                <option value="Asset">Asset</option>
                <option value="Liability">Liability</option>
            </select>
        </div>

        <div class="form-group">
            <label for="subCategory">Sub Category</label>
            <select id="subCategory" required disabled>
                <option value="">Select Transaction Type First</option>
            </select>
        </div>

        <div class="form-group">
            <label for="paymentMethod">Payment Method</label>
            <select id="paymentMethod" required>
                <option value="Cash">Cash</option>
                <option value="Bank">Bank Account</option>
                <option value="bKash">bKash</option>
                <option value="Nagad">Nagad</option>
                <option value="Credit Card">Credit Card</option>
            </select>
        </div>

        <div class="form-group">
            <label for="amount">Amount (BDT)</label>
            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">💾 Save Transaction</button>

        <div id="statusMsg"></div>
    </form>
</div>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyjf9eQuTWzXa7wazCLlZR1iHLm7Cj2E4X2WjkC9SvwgwxcgTqc0pnlzZBDTN_S47tJ/exec';

    const subCategoriesMap = {
        'Income': ['Salary', 'Business', 'Freelancing', 'Bonus', 'Dividend', 'Others'],
        'Expense': ['Food', 'House Rent', 'Utility Bills', 'Transportation', 'Entertainment', 'Shopping', 'Medical', 'Education', 'Others'],
        'Investment': ['Stocks/Shares', 'Mutual Funds', 'Fixed Deposit (FDR)', 'DPS', 'Real Estate', 'Crypto', 'Gold'],
        'Loan/Transfer': ['Given Loan', 'Repaid Loan', 'Bank Transfer', 'Mobile Banking Transfer'],
        'Asset': ['Property Purchase', 'Vehicle', 'Electronics', 'Gold Purchase'],
        'Liability': ['Credit Card Bill', 'Personal Loan', 'Home Loan']
    };

    let formattedBackendDate = "";

    // Flatpickr সেটআপ
    const fp = flatpickr("#date", {
        dateFormat: "Y-m-d",
        defaultDate: new Date(),
        onChange: function(selectedDates, dateStr) {
            formattedBackendDate = dateStr;
        }
    });

    // ইনিশিয়াল ডেট ফরম্যাটিং
    function setBackendDate(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        formattedBackendDate = `${year}-${month}-${day}`;
    }
    setBackendDate(new Date());

    // সাব-ক্যাটাগরি আপডেট করার ফাংশন
    function updateSubCategories() {
        const typeSelect = document.getElementById("transactionType");
        const subSelect = document.getElementById("subCategory");
        const selectedType = typeSelect.value;

        subSelect.innerHTML = '<option value="">Select Sub Category</option>';

        if (selectedType && subCategoriesMap[selectedType]) {
            subSelect.disabled = false;
            subCategoriesMap[selectedType].forEach(sub => {
                const opt = document.createElement("option");
                opt.value = sub;
                opt.textContent = sub;
                subSelect.appendChild(opt);
            });
        } else {
            subSelect.disabled = true;
            subSelect.innerHTML = '<option value="">Select Transaction Type First</option>';
        }
    }

    // ফর্ম সাবমিশন
    const form = document.getElementById('entryForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', e => {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerHTML = '⏳ Saving Transaction...';

        statusMsg.className = "loading";
        statusMsg.innerText = "Saving transaction to Google Sheets...";

        const payload = {
            date: formattedBackendDate,
            transactionType: document.getElementById('transactionType').value,
            subCategory: document.getElementById('subCategory').value,
            paymentMethod: document.getElementById('paymentMethod').value,
            amount: document.getElementById('amount').value
        };

        fetch(scriptURL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success' || data.result === 'success') {
                statusMsg.className = "success";
                statusMsg.innerText = "✓ Transaction saved successfully!";

                form.reset();
                fp.setDate(new Date());
                setBackendDate(new Date());

                const subCategory = document.getElementById("subCategory");
                subCategory.disabled = true;
                subCategory.innerHTML = '<option value="">Select Transaction Type First</option>';
            } else {
                throw new Error(data.message || data.error || 'Error occurred');
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = '💾 Save Transaction';

            setTimeout(() => {
                statusMsg.className = "";
                statusMsg.style.display = "none";
            }, 4000);
        })
        .catch(error => {
            console.error(error);
            statusMsg.className = "error";
            statusMsg.innerText = "✕ Error saving data. Please try again.";

            submitBtn.disabled = false;
            submitBtn.innerHTML = '💾 Save Transaction';
        });
    });
</script>

</body>
</html>
