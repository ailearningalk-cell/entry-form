<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Entry Form</title>
    <!-- Flatpickr CSS for custom Date Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            margin: 20px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        /* Fixed Header Height (Same as dashboard.html) */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }
        h2 { color: #1e293b; font-size: 22px; line-height: 1; }
        .btn-nav {
            display: inline-flex;
            align-items: center;
            padding: 10px 18px;
            background-color: #4f46e5;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }
        .btn-nav:hover { background-color: #4338ca; }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        
        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            background-color: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #4f46e5;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            background-color: #10b981;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        button[type="submit"]:hover { background-color: #059669; }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        #statusMsg { text-align: center; font-weight: 600; margin-top: 15px; font-size: 14px; }

        @media (max-width: 550px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>Financial Entry Form</h2>
        <a href="dashboard.html" class="btn-nav">📊 View Dashboard</a>
    </div>

    <form id="financeForm">
        <div class="form-grid">
            <!-- Date Input -->
            <div class="form-group">
                <label for="date">Date</label>
                <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" required>
            </div>

            <!-- Transaction Type -->
            <div class="form-group">
                <label for="transactionType">Transaction Type</label>
                <select id="transactionType" name="transactionType" onchange="updateSubCategories()" required>
                    <option value="">-- Select Type --</option>
                    <option value="Income">Income</option>
                    <option value="Expense">Expense</option>
                    <option value="Investment">Investment</option>
                    <option value="Loan/Transfer">Loan/Transfer</option>
                    <option value="Asset">Asset</option>
                    <option value="Liability">Liability</option>
                </select>
            </div>

            <!-- Sub Category -->
            <div class="form-group full-width">
                <label for="subCategory">Sub Category</label>
                <select id="subCategory" name="subCategory" required disabled>
                    <option value="">-- Select Sub Category --</option>
                </select>
            </div>

            <!-- Payment Method -->
            <div class="form-group">
                <label for="paymentMethod">Payment Method</label>
                <select id="paymentMethod" name="paymentMethod" required>
                    <option value="">-- Select Method --</option>
                    <option value="Cash">Cash</option><option value="DBBL">DBBL</option><option value="JBL">JBL</option>
                    <option value="BDBL">BDBL</option><option value="IBBL">IBBL</option><option value="SCB_V">SCB_V</option>
                    <option value="SCB_M">SCB_M</option><option value="EBL_V">EBL_V</option><option value="EBL_M">EBL_M</option>
                    <option value="Meghna">Meghna</option><option value="bKash">bKash</option><option value="Nagad">Nagad</option>
                    <option value="Rocket">Rocket</option><option value="Bank Transfer">Bank Transfer</option><option value="Credit Card">Credit Card</option>
                </select>
            </div>

            <!-- Amount -->
            <div class="form-group">
                <label for="amount">Value to Tk</label>
                <input type="number" id="amount" name="amount" min="0" step="any" placeholder="0.00" required>
            </div>
        </div>

        <button type="submit" id="submitBtn">Submit</button>
    </form>
    <p id="statusMsg"></p>
</div>

<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    // Variable to store actual backend date format (YYYY-MM-DD)
    let formattedBackendDate = "";

    function setBackendDate(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        formattedBackendDate = `${year}-${month}-${day}`;
    }

    // Initialize Flatpickr for DD/MM/YYYY view format
    const fp = flatpickr("#date", {
        dateFormat: "d/m/Y",
        defaultDate: "today",
        onReady: function(selectedDates) {
            if (selectedDates[0]) setBackendDate(selectedDates[0]);
        },
        onChange: function(selectedDates) {
            if (selectedDates[0]) setBackendDate(selectedDates[0]);
        }
    });

    const subCategoriesData = {
        "Income": ["Salary", "Honourarium", "Bank Int", "FDR_Int", "Bond_Int", "SP_Int", "Rent", "Business", "Freelancing", "Other Income"],
        "Expense": ["Bazar", "Food", "Dress", "Family", "Education", "Medicine", "Treatment", "Donation", "Zakat", "Gift", "Social Exp", "Travelling", "Car_Driver", "Car_oil", "Car_Maint", "Fare", "Paper", "Rent", "Utility Bill", "Mobile/Internet", "Other Expense"],
        "Investment": ["SP", "FDR", "Bond", "Land", "Building", "Chuti", "DPS", "Share Market", "Mutual Fund"],
        "Loan/Transfer": ["Loan Given", "Loan Taken", "Loan Repaid", "Loan Received", "Bank Transfer"],
        "Asset": ["Building", "SP", "FDR", "Land", "Gold", "Vehicle", "Electronics", "Cash/Bank Balance"],
        "Liability": ["Home Loan", "Personal Loan", "Credit Card Due", "Other Payable"]
    };

    function updateSubCategories() {
        const typeSelect = document.getElementById("transactionType");
        const subSelect = document.getElementById("subCategory");
        const selectedType = typeSelect.value;
        subSelect.innerHTML = '<option value="">-- Select Sub Category --</option>';

        if (selectedType && subCategoriesData[selectedType]) {
            subSelect.disabled = false;
            subCategoriesData[selectedType].forEach(subCat => {
                const option = document.createElement("option");
                option.value = subCat; 
                option.textContent = subCat;
                subSelect.appendChild(option);
            });
        } else {
            subSelect.disabled = true;
        }
    }

    const scriptURL = 'https://script.google.com/macros/s/AKfycbyjf9eQuTWzXa7wazCLlZR1iHLm7Cj2E4X2WjkC9SvwgwxcgTqc0pnlzZBDTN_S47tJ/exec'; // Replace with your Web App URL
    const form = document.getElementById('financeForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        statusMsg.style.color = "#0284c7";
        statusMsg.innerText = "Saving data...";

        const formData = new FormData(form);
        // Ensure backend gets YYYY-MM-DD
        formData.set('date', formattedBackendDate);

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(response => {
                statusMsg.style.color = "#10b981";
                statusMsg.innerText = "Data successfully saved to Google Sheet!";
                form.reset();
                fp.setDate(new Date());
                setBackendDate(new Date());
                document.getElementById("subCategory").disabled = true;
                submitBtn.disabled = false;
            })
            .catch(error => {
                statusMsg.style.color = "#ef4444";
                statusMsg.innerText = "Error saving data! Please try again.";
                submitBtn.disabled = false;
            });
    });
</script>
</body>
</html>
