<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 20px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 50px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }
        h2 { color: #1e293b; font-size: 22px; line-height: 1; }
        
        .btn-nav {
            display: inline-flex;
            align-items: center;
            padding: 10px 18px;
            background-color: #64748b;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }
        .btn-nav:hover { background-color: #475569; }

        .filter-section { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .filter-section select { padding: 6px 12px; font-size: 16px; border-radius: 4px; border: 1px solid #cbd5e1; }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card { padding: 18px; border-radius: 8px; text-align: center; color: white; }
        .card h4 { margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.9; }
        .card .amount { font-size: 22px; font-weight: bold; }
        
        .card-income { background-color: #1b4965; }
        .card-expense { background-color: #b7094c; }
        .card-surplus { background-color: #2b9348; }
        .card-investment { background-color: #52b788; }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #cbd5e1; padding: 12px 10px; text-align: right; }
        th { background-color: #1e3a8a; color: white; text-align: center; font-weight: 600; }
        td:first-child, th:first-child { text-align: left; font-weight: bold; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .total-row { background-color: #e2e8f0 !important; font-weight: bold; }
        .loading { text-align: center; font-weight: bold; color: #0284c7; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>Financial Summary Dashboard</h2>
        <a href="index.html" class="btn-nav">← Back to Entry Form</a>
    </div>

    <div class="filter-section">
        <label for="yearFilter">Select Year:</label>
        <select id="yearFilter" onchange="fetchDashboardData()">
            <option value="2026" selected>2026</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
        </select>
    </div>

    <!-- Top Summary Cards -->
    <div class="card-grid">
        <div class="card card-income">
            <h4>Total Income</h4>
            <div class="amount" id="cardIncome">৳ 0.00</div>
        </div>
        <div class="card card-expense">
            <h4>Total Expense</h4>
            <div class="amount" id="cardExpense">৳ 0.00</div>
        </div>
        <div class="card card-surplus">
            <h4>Net Surplus</h4>
            <div class="amount" id="cardSurplus">৳ 0.00</div>
        </div>
        <div class="card card-investment">
            <h4>Total Investment</h4>
            <div class="amount" id="cardInvestment">৳ 0.00</div>
        </div>
    </div>

    <!-- Monthly Breakdown Table -->
    <h3 style="color: #1e293b; margin-top: 10px;">Monthly Financial Breakdown</h3>
    <div id="loadingMsg" class="loading">Loading Data...</div>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Month</th>
                    <th>Income</th>
                    <th>Expense</th>
                    <th>Surplus</th>
                    <th>Investment</th>
                    <th>Loan / Transfer</th>
                    <th>Asset</th>
                    <th>Liability</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
            <tfoot>
                <tr class="total-row" id="tableTotal"></tr>
            </tfoot>
        </table>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyjf9eQuTWzXa7wazCLlZR1iHLm7Cj2E4X2WjkC9SvwgwxcgTqc0pnlzZBDTN_S47tJ/exec';

    function fetchDashboardData() {
        const year = document.getElementById('yearFilter').value;
        const loadingMsg = document.getElementById('loadingMsg');
        loadingMsg.style.display = 'block';
        loadingMsg.innerText = 'Loading Data...';

        fetch(`${scriptURL}?year=${year}`)
            .then(res => res.json())
            .then(data => {
                loadingMsg.style.display = 'none';
                if (data && data.summary) {
                    renderDashboard(data.summary);
                } else {
                    loadingMsg.style.display = 'block';
                    loadingMsg.innerText = 'No summary data found.';
                }
            })
            .catch(err => {
                loadingMsg.style.display = 'block';
                loadingMsg.innerText = 'Failed to load data!';
                console.error(err);
            });
    }

    function renderDashboard(summary) {
        const tbody = document.getElementById('tableBody');
        const tfoot = document.getElementById('tableTotal');
        tbody.innerHTML = '';
        
        let totals = { Income: 0, Expense: 0, Surplus: 0, Investment: 0, Loan: 0, Asset: 0, Liability: 0 };
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        months.forEach(m => {
            const d = summary[m] || { Income: 0, Expense: 0, Surplus: 0, Investment: 0, Loan: 0, Asset: 0, Liability: 0 };
            
            totals.Income += d.Income || 0;
            totals.Expense += d.Expense || 0;
            totals.Surplus += d.Surplus || 0;
            totals.Investment += d.Investment || 0;
            totals.Loan += d.Loan || 0;
            totals.Asset += d.Asset || 0;
            totals.Liability += d.Liability || 0;

            tbody.innerHTML += `
                <tr>
                    <td>${m}</td>
                    <td>${(d.Income || 0).toFixed(2)}</td>
                    <td>${(d.Expense || 0).toFixed(2)}</td>
                    <td>${(d.Surplus || 0).toFixed(2)}</td>
                    <td>${(d.Investment || 0).toFixed(2)}</td>
                    <td>${(d.Loan || 0).toFixed(2)}</td>
                    <td>${(d.Asset || 0).toFixed(2)}</td>
                    <td>${(d.Liability || 0).toFixed(2)}</td>
                </tr>
            `;
        });

        document.getElementById('cardIncome').innerText = `৳ ${totals.Income.toFixed(2)}`;
        document.getElementById('cardExpense').innerText = `৳ ${totals.Expense.toFixed(2)}`;
        document.getElementById('cardSurplus').innerText = `৳ ${totals.Surplus.toFixed(2)}`;
        document.getElementById('cardInvestment').innerText = `৳ ${totals.Investment.toFixed(2)}`;

        tfoot.innerHTML = `
            <td>Total Summary</td>
            <td>৳ ${totals.Income.toFixed(2)}</td>
            <td>৳ ${totals.Expense.toFixed(2)}</td>
            <td>৳ ${totals.Surplus.toFixed(2)}</td>
            <td>৳ ${totals.Investment.toFixed(2)}</td>
            <td>৳ ${totals.Loan.toFixed(2)}</td>
            <td>৳ ${totals.Asset.toFixed(2)}</td>
            <td>৳ ${totals.Liability.toFixed(2)}</td>
        `;
    }

    fetchDashboardData();
</script>
</body>
</html>
