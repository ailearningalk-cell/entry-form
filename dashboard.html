<script>

const scriptURL = 'https://script.google.com/macros/s/AKfycbyjf9eQuTWzXa7wazCLlZR1iHLm7Cj2E4X2WjkC9SvwgwxcgTqc0pnlzZBDTN_S47tJ/exec';


const months = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
];



function formatAmount(value) {

    const number = Number(value) || 0;

    return number.toLocaleString('en-BD', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });

}



function fetchDashboardData() {

    const year = document.getElementById('yearFilter').value;

    console.log("Fetching data for year:", year);


    const loadingMsg =
        document.getElementById('loadingMsg');


    if (loadingMsg) {

        loadingMsg.style.display = 'block';

        loadingMsg.innerText = 'Loading Data...';

    }


    fetch(scriptURL + '?year=' + year)

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    'HTTP Error: ' + response.status
                );

            }

            return response.json();

        })


        .then(function(data) {

            console.log(
                "Dashboard Response:",
                data
            );


            if (loadingMsg) {

                loadingMsg.style.display = 'none';

            }


            if (!data) {

                throw new Error(
                    "No data received from server"
                );

            }


            if (!data.summary) {

                throw new Error(
                    "Summary data not found"
                );

            }


            renderDashboard(data.summary);

        })


        .catch(function(error) {

            console.error(
                "Dashboard Error:",
                error
            );


            if (loadingMsg) {

                loadingMsg.style.display = 'block';

                loadingMsg.innerHTML =
                    '⚠ Failed to load data.<br>' +
                    '<small>' +
                    error.message +
                    '</small>';

            }

        });

}




function renderDashboard(summary) {


    console.log(
        "Rendering Summary:",
        summary
    );


    const tbody =
        document.getElementById('tableBody');


    const tfoot =
        document.getElementById('tableTotal');


    if (!tbody) {

        console.error(
            "ERROR: tableBody not found"
        );

        return;

    }


    if (!tfoot) {

        console.error(
            "ERROR: tableTotal not found"
        );

        return;

    }


    tbody.innerHTML = '';


    let totals = {

        Income: 0,
        Expense: 0,
        Surplus: 0,
        Investment: 0,
        Loan: 0,
        Asset: 0,
        Liability: 0

    };



    months.forEach(function(month) {


        const d = summary[month] || {

            Income: 0,
            Expense: 0,
            Investment: 0,
            Loan: 0,
            Asset: 0,
            Liability: 0,
            Surplus: 0

        };


        const income =
            Number(d.Income) || 0;


        const expense =
            Number(d.Expense) || 0;


        const surplus =
            Number(d.Surplus) || 0;


        const investment =
            Number(d.Investment) || 0;


        const loan =
            Number(d.Loan) || 0;


        const asset =
            Number(d.Asset) || 0;


        const liability =
            Number(d.Liability) || 0;



        totals.Income += income;

        totals.Expense += expense;

        totals.Surplus += surplus;

        totals.Investment += investment;

        totals.Loan += loan;

        totals.Asset += asset;

        totals.Liability += liability;



        const row =
            document.createElement('tr');



        row.innerHTML = `

            <td>${month}</td>

            <td>৳ ${formatAmount(income)}</td>

            <td>৳ ${formatAmount(expense)}</td>

            <td class="${surplus < 0 ? 'negative' : 'positive'}">
                ৳ ${formatAmount(surplus)}
            </td>

            <td>৳ ${formatAmount(investment)}</td>

            <td>৳ ${formatAmount(loan)}</td>

            <td>৳ ${formatAmount(asset)}</td>

            <td>৳ ${formatAmount(liability)}</td>

        `;


        tbody.appendChild(row);


    });



    /* =================================
       UPDATE SUMMARY CARDS
    ================================= */


    const cardIncome =
        document.getElementById('cardIncome');


    const cardExpense =
        document.getElementById('cardExpense');


    const cardSurplus =
        document.getElementById('cardSurplus');


    const cardInvestment =
        document.getElementById('cardInvestment');



    if (cardIncome) {

        cardIncome.innerText =
            '৳ ' +
            formatAmount(totals.Income);

    }


    if (cardExpense) {

        cardExpense.innerText =
            '৳ ' +
            formatAmount(totals.Expense);

    }


    if (cardSurplus) {

        cardSurplus.innerText =
            '৳ ' +
            formatAmount(totals.Surplus);

    }


    if (cardInvestment) {

        cardInvestment.innerText =
            '৳ ' +
            formatAmount(totals.Investment);

    }



    /* =================================
       TOTAL ROW
    ================================= */


    tfoot.innerHTML = `

        <td>Total Summary</td>

        <td>
            ৳ ${formatAmount(totals.Income)}
        </td>

        <td>
            ৳ ${formatAmount(totals.Expense)}
        </td>

        <td>
            ৳ ${formatAmount(totals.Surplus)}
        </td>

        <td>
            ৳ ${formatAmount(totals.Investment)}
        </td>

        <td>
            ৳ ${formatAmount(totals.Loan)}
        </td>

        <td>
            ৳ ${formatAmount(totals.Asset)}
        </td>

        <td>
            ৳ ${formatAmount(totals.Liability)}
        </td>

    `;



    console.log(
        "Dashboard rendered successfully"
    );


}



/* =================================
   LOAD DASHBOARD
================================= */


document.addEventListener(
    'DOMContentLoaded',
    function() {

        console.log(
            "Dashboard initialized"
        );

        fetchDashboardData();

    }
);

</script>
